<!doctype html><html data-size="1600,900"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
 body { padding: 0 0 0 76px; }
 .text { width: 640px; }
 .icon { width: 190px; height: 190px; margin: 0 0 18px -20px; display: block; }
 h1 { font-size: 92px; font-weight: 800; letter-spacing: -2px; }
 .text p { font-size: 30px; line-height: 1.55; max-width: 600px; }
 .screen { position: absolute; right: 40px; top: 40px; width: 760px; height: 900px; border-radius: 26px 26px 0 0;
   background: linear-gradient(180deg,#1b2442,#141b31); box-shadow: 0 0 0 1.5px rgba(140,160,255,.25); overflow: hidden; }
 .bar { height: 42px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: flex-end; gap: 22px; padding: 0 22px;
   font: 600 17px -apple-system; color: #e8ebf5; }
 .bar svg { height: 18px; }
 .lark { background: rgba(255,255,255,.18); border-radius: 7px; padding: 4px 8px; display: flex; gap: 2px; }
 .panel { position: absolute; top: 58px; right: 28px; border-radius: 16px; overflow: hidden;
   box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 30px 70px rgba(0,0,0,.6); }
 .panel img { width: 640px; display: block; }
 .cursor { position: absolute; top: 22px; right: 168px; width: 26px; }
 .win { position: absolute; left: 40px; top: 120px; width: 420px; height: 300px; border-radius: 14px; background: rgba(255,255,255,.05);
   box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
 .win i { display: block; height: 12px; border-radius: 6px; background: rgba(255,255,255,.1); margin: 22px 26px 0; }
 .win i:first-child { width: 120px; background: #e0796a; margin-top: 46px; }
</style></head>
<body><div class="text"><img class="icon" src="icon.png"><h1>Lark</h1>
<p>Звук, микрофон и всё, что играет на Mac, — в одном щелчке по строке меню.</p></div>
<div class="screen">
 <div class="bar">
  <span class="lark"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="2" width="14" height="20" rx="3"/><circle cx="12" cy="15" r="3.4" fill="#1b2442"/><circle cx="12" cy="7" r="1.7" fill="#1b2442"/></svg><svg viewBox="0 0 24 24" fill="#fff"><rect x="8.5" y="2" width="7" height="13" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0" stroke="#fff" stroke-width="2" fill="none"/><rect x="11" y="18" width="2" height="4"/></svg></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="#e8ebf5" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="#e8ebf5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
  <svg viewBox="0 0 30 16"><rect x="1" y="2" width="24" height="12" rx="3.5" fill="none" stroke="#e8ebf5" stroke-width="1.6"/><rect x="3.5" y="4.5" width="16" height="7" rx="1.5" fill="#e8ebf5"/><rect x="26.5" y="6" width="2" height="4" rx="1" fill="#e8ebf5"/></svg>
  <span>7:30</span>
 </div>
 <div class="win"><i></i><i style="width:320px"></i><i style="width:260px"></i><i style="width:300px"></i></div>
 <div class="panel"><img src="panel-playing.png"></div>
 <svg class="cursor" viewBox="0 0 24 24"><path d="M5 2v18l5-5 3.5 7 3-1.5L13 14h7z" fill="#fff" stroke="#000" stroke-width="1.3"/></svg>
</div></body></html>
